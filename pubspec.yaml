name: flutter_opendroneid
description: A flutter plugin for reading Wi-Fi and Bluetooth Remote ID advertisements using native Android and iOS platform-specific implementation.
version: 1.2.0
repository: https://github.com/dronetag/flutter-opendroneid
environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"
dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^12.0.3
  device_info_plus: ^13.2.0
  dart_opendroneid: ^1.0.0
dev_dependencies:
  pigeon: ^27.3.0
dependency_overrides: 
  dart_opendroneid:
    git: 
      url: git@github.com:dronetag/dart-opendroneid.git
      ref: chore/update-dart

flutter:
  plugin:
    platforms:
      android:
        package: cz.dronetag.flutter_opendroneid
        pluginClass: FlutterOpendroneidPlugin
      ios:
        pluginClass: SwiftFlutterOpendroneidPlugin
