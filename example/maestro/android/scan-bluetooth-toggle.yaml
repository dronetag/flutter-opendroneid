appId: com.example.flutter_opendroneid_example
name: "Android: Bluetooth scan start/stop"
tags:
  - android
  - scan
---
# Prerequisite: Bluetooth must be enabled on the device.
- launchApp:
    permissions:
      all: allow

- runFlow:
    file: ../flows/grant-permissions.yaml

- extendedWaitUntil:
    visible:
      id: "scan-bluetooth-start"
    timeout: 15000

- tapOn:
    id: "scan-bluetooth-start"
- extendedWaitUntil:
    visible:
      id: "scan-bluetooth-stop"
    timeout: 10000
- takeScreenshot: bluetooth-scanning

- tapOn:
    id: "scan-bluetooth-stop"
- extendedWaitUntil:
    visible:
      id: "scan-bluetooth-start"
    timeout: 10000
